name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "tizimClient/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "tizimClient/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tizimClient
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tizimClient/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build

      # Pre-existing lint issues are not yet fixed (tracked separately) —
      # surfaced here but not blocking the pipeline.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
