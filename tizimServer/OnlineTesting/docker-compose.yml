services:
  postgres:
    image: postgres:16
    container_name: tizim-pg
    environment:
      POSTGRES_DB: tizim
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - tizim_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: tizim-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tizim_minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  tizim_postgres_data:
  tizim_minio_data:
